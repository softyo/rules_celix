name: 🐛 Bug Report
description: Report a bug in rules_celix
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please provide as much detail as possible to help us reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: "The bundle zip is missing the MANIFEST.MF file..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this? Please provide a minimal Bazel example or a link to a repository.
      placeholder: |
        1. Clone rules_celix
        2. Run `bazel build //examples/hello_c:bundle`
        3. Inspect the generated zip...
    validations:
      required: true

  - type: input
    id: bazel_version
    attributes:
      label: Bazel Version
      description: Output of `bazel version`
      placeholder: "e.g., bazel 7.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: expected_actual
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what actually happened?
      placeholder: |
        **Expected:** Zip contains `META-INF/MANIFEST.MF`
        **Actual:** Zip is empty or throws an error

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have checked that this issue is not already reported.
          required: true
        - label: I have provided a minimal reproducible example.
          required: false
