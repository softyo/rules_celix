name: DCO check

on:
  pull_request:
    branches: [main]

jobs:
  dco:
    name: "DCO sign-off check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check DCO sign-off
        run: |
          set -euo pipefail

          # Get the base and head SHAs for the pull request.
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # Collect commits that are in the PR but not in the base.
          COMMITS=$(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")

          if [ -z "$COMMITS" ]; then
            echo "No non-merge commits to check."
            exit 0
          fi

          MISSING=0
          for commit in $COMMITS; do
            if ! git log --format=%B -n 1 "$commit" | grep -q '^Signed-off-by: '; then
              echo "Commit $commit is missing a Signed-off-by line:"
              git log --oneline -n 1 "$commit"
              MISSING=1
            fi
          done

          if [ "$MISSING" -ne 0 ]; then
            echo ""
            echo "One or more commits are missing a Signed-off-by trailer."
            echo "See CONTRIBUTING.md for instructions."
            exit 1
          fi

          echo "All commits have a valid Signed-off-by line."
